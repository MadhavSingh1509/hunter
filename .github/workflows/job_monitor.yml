name: Hunter 2.0 Job Hunting Assistant

on:
  schedule:
    - cron: "0 */12 * * *"   # runs every 12 hours
  workflow_dispatch: {}       # enables manual triggers from Actions tab

jobs:
  run-hunter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run automated test suite
        run: |
          pytest -v

      - name: Execute Hunter 2.0 Monitor
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          HUNTER_GRADUATION_YEAR: ${{ vars.HUNTER_GRADUATION_YEAR }}
          HUNTER_LOCATION: ${{ vars.HUNTER_LOCATION }}
        run: python monitor.py

      - name: Commit and persist job state and tracker records
        run: |
          git config user.name "hunter-bot"
          git config user.email "actions@github.com"
          git add state.json job_tracker.json applications.csv candidate_profile.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Hunter 2.0 job state and application tracker [skip ci]"
          git pull --rebase origin main
          git push origin main
